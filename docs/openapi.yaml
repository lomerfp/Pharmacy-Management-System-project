          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBatch'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
    delete:
      operationId: api_batches_destroy
      parameters:
