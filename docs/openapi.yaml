openapi: 3.0.3
info:
  title: Pharmacy Management System API
  version: 0.1.0
  description: Single-location pharmacy operations REST API.
paths:
  /api/audit/:
    get:
      operationId: api_audit_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
