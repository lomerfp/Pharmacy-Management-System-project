          content:
            application/json:
              schema:
                type: object
                properties:
                  business_date:
                    type: string
                    format: date
                  completed_sales:
                    type: integer
                  sales_total:
                    type: string
                  payment_total:
                    type: string
                  active_drug_count:
                    type: integer
                  sellable_units:
                    type: integer
                  low_stock_drugs:
                    type: array
                    items:
                      type: object
                  expired_batch_count:
                    type: integer
                  expiring_batch_count:
                    type: integer
                  pending_purchase_orders:
                    type: integer
                  top_selling_drugs:
                    type: array
                    items:
                      type: object
                  recent_activity:
                    type: array
                    items:
